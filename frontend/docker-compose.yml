# Frontend em Docker, consumindo o backend mock local (store em memória).
#
#   docker compose up --build       → inbox em http://localhost:3000 (API mock em :4000)
#
# Só a API mock (sem o app web):    docker compose up api
# Alternativa sem Docker:           cd server && node local.mjs
services:
  # Backend mock que serve o contrato do frontend (/me, /conversations, /ai/suggest…).
  api:
    image: node:22-alpine
    working_dir: /app
    command: node local.mjs
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app

  # App Next.js. NEXT_PUBLIC_API_URL é inlinado no build e precisa ser alcançável
  # pelo navegador → aponta para o mock publicado no host (localhost:4000).
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
